<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>FBNeo Retro SFX Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Meiryo, sans-serif;
      background-color: #121218;
      color: #e0e0e0;
      max-width: 640px;
      margin: 24px auto;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 1.3rem;
      color: #00ffcc;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-top: 0;
    }
    .badge {
      font-size: 0.75rem;
      background: #223;
      color: #00ffcc;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #00ffcc;
      vertical-align: middle;
      margin-left: 8px;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    button {
      background-color: #2a2a38;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    button:hover { background-color: #3a3a4e; border-color: #00ffcc; }
    .control-group {
      background: #1a1a24;
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 14px;
      border: 1px solid #2c2c3a;
    }
    .control-group h2 {
      font-size: 0.9rem;
      color: #aaa;
      margin: 0 0 10px 0;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .row label { font-size: 0.85rem; width: 42%; }
    .row input[type="range"] { width: 42%; accent-color: #00ffcc; }
    .row select { width: 42%; background: #222; color: #fff; border: 1px solid #555; padding: 4px; }
    .row span { font-size: 0.8rem; width: 14%; text-align: right; font-family: monospace; color: #00ffcc; }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn-play {
      flex: 1;
      background-color: #007acc;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      padding: 12px;
    }
    .btn-play:hover { background-color: #0090f0; }
    .btn-dl {
      flex: 1;
      background-color: #00aa77;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      padding: 12px;
    }
    .btn-dl:hover { background-color: #00cc88; }
    .filename-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 0.85rem;
    }
    .filename-box input {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 6px;
      border-radius: 4px;
      width: 120px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>FBNeo Retro SFX Generator <span class="badge">44.1kHz / 16bit / Mono</span></h1>

  <div class="presets">
    <button onclick="applyPreset('zapper')">🔫 発射音 (ザッパー風)</button>
    <button onclick="applyPreset('blaster')">💣 爆撃音 (ブラスター風)</button>
    <button onclick="applyPreset('explosion')">💥 大爆発 (ノイズ減衰)</button>
    <button onclick="applyPreset('bacura')">🛡️ 金属弾き音 (バキュラ風)</button>
    <button onclick="applyPreset('hit')">👾 敵撃破音 (ピロロッ)</button>
    <button onclick="applyPreset('random')">🎲 ランダム生成</button>
  </div>

  <div class="control-group">
    <h2>1. 基本波形 ＆ ピッチ (オシレーター)</h2>
    <div class="row">
      <label>波形タイプ</label>
      <select id="waveType">
        <option value="square">矩形波 (Square - ファミコン/基板風)</option>
        <option value="sawtooth">ノコギリ波 (Sawtooth - 鋭い音)</option>
        <option value="triangle">三角波 (Triangle - 柔らかい音)</option>
        <option value="noise">ホワイトノイズ (爆発・風)</option>
        <option value="lfsr">LFSR粗ノイズ (レトロチップ爆発)</option>
      </select>
      <span></span>
    </div>
    <div class="row">
      <label>開始周波数 (Hz)</label>
      <input type="range" id="startFreq" min="40" max="4000" value="1400" oninput="upd()">
      <span id="startFreqVal">1400</span>
    </div>
    <div class="row">
      <label>終了周波数 (Hz)</label>
      <input type="range" id="endFreq" min="20" max="4000" value="120" oninput="upd()">
      <span id="endFreqVal">120</span>
    </div>
    <div class="row">
      <label>ピッチ変化カーブ</label>
      <input type="range" id="pitchCurve" min="0.2" max="4.0" step="0.1" value="1.8" oninput="upd()">
      <span id="pitchCurveVal">1.8</span>
    </div>
  </div>

  <div class="control-group">
    <h2>2. 変調 (ビブラート / 金属音 / アルペジオ感)</h2>
    <div class="row">
      <label>変調スピード (LFO Hz)</label>
      <input type="range" id="lfoFreq" min="0" max="150" value="0" oninput="upd()">
      <span id="lfoFreqVal">0</span>
    </div>
    <div class="row">
      <label>変調の深さ (Hz)</label>
      <input type="range" id="lfoDepth" min="0" max="1500" value="0" oninput="upd()">
      <span id="lfoDepthVal">0</span>
    </div>
  </div>

  <div class="control-group">
    <h2>3. フィルター ＆ 時間 (エンベロープ)</h2>
    <div class="row">
      <label>長さ (秒)</label>
      <input type="range" id="duration" min="0.05" max="2.5" step="0.05" value="0.25" oninput="upd()">
      <span id="durationVal">0.25</span>
    </div>
    <div class="row">
      <label>音量減衰カーブ</label>
      <input type="range" id="decayCurve" min="0.3" max="4.0" step="0.1" value="1.2" oninput="upd()">
      <span id="decayCurveVal">1.2</span>
    </div>
    <div class="row">
      <label>ローパス開始 (Hz)</label>
      <input type="range" id="filterStart" min="100" max="12000" step="100" value="8000" oninput="upd()">
      <span id="filterStartVal">8000</span>
    </div>
    <div class="row">
      <label>ローパス終了 (Hz)</label>
      <input type="range" id="filterEnd" min="50" max="12000" step="50" value="1000" oninput="upd()">
      <span id="filterEndVal">1000</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn-play" onclick="playSound()">▶ 試聴する (Play)</button>
    <button class="btn-dl" onclick="downloadWav()">💾 WAVダウンロード</button>
  </div>

  <div class="filename-box">
    <label for="fileName">保存ファイル名:</label>
    <input type="text" id="fileName" value="00.wav">
    <span style="color:#888;">※FBNeo用に連番(00.wav, 01.wav等)で保存できます</span>
  </div>

<script>
const SAMPLE_RATE = 44100;
let audioCtx = null;

function upd() {
  const ids = ['startFreq', 'endFreq', 'pitchCurve', 'lfoFreq', 'lfoDepth', 'duration', 'decayCurve', 'filterStart', 'filterEnd'];
  ids.forEach(id => {
    document.getElementById(id + 'Val').textContent = document.getElementById(id).value;
  });
}

function getParams() {
  return {
    waveType: document.getElementById('waveType').value,
    startFreq: parseFloat(document.getElementById('startFreq').value),
    endFreq: parseFloat(document.getElementById('endFreq').value),
    pitchCurve: parseFloat(document.getElementById('pitchCurve').value),
    lfoFreq: parseFloat(document.getElementById('lfoFreq').value),
    lfoDepth: parseFloat(document.getElementById('lfoDepth').value),
    duration: parseFloat(document.getElementById('duration').value),
    decayCurve: parseFloat(document.getElementById('decayCurve').value),
    filterStart: parseFloat(document.getElementById('filterStart').value),
    filterEnd: parseFloat(document.getElementById('filterEnd').value)
  };
}

// 44.1kHz / Mono のFloat32波形データを生成
function generateSamples(p) {
  const totalSamples = Math.floor(SAMPLE_RATE * p.duration);
  const buffer = new Float32Array(totalSamples);

  let phase = 0;
  let lfoPhase = 0;
  let lfsr = 0xACE1; // 16-bit LFSRシード
  let lfsrCounter = 0;
  let currentNoise = 0;

  // 簡易1次ローパスフィルター用変数
  let lpOut = 0;

  for (let i = 0; i < totalSamples; i++) {
    const t = i / totalSamples; // 0.0 -> 1.0

    // ピッチ計算
    const pitchProgress = Math.pow(t, p.pitchCurve);
    let freq = p.startFreq + (p.endFreq - p.startFreq) * pitchProgress;

    // LFO変調
    if (p.lfoFreq > 0 && p.lfoDepth > 0) {
      lfoPhase += (2 * Math.PI * p.lfoFreq) / SAMPLE_RATE;
      freq += Math.sin(lfoPhase) * p.lfoDepth;
    }
    freq = Math.max(10, freq);

    // 波形生成
    phase += freq / SAMPLE_RATE;
    if (phase >= 1.0) phase -= Math.floor(phase);

    let sample = 0;
    if (p.waveType === 'square') {
      sample = phase < 0.5 ? 1.0 : -1.0;
    } else if (p.waveType === 'sawtooth') {
      sample = 2.0 * phase - 1.0;
    } else if (p.waveType === 'triangle') {
      sample = 1.0 - 4.0 * Math.abs(Math.round(phase - 0.25) - (phase - 0.25));
    } else if (p.waveType === 'noise') {
      sample = Math.random() * 2.0 - 1.0;
    } else if (p.waveType === 'lfsr') {
      // 周波数に応じてサンプルホールドするレトロノイズ
      lfsrCounter += freq / SAMPLE_RATE;
      if (lfsrCounter >= 1.0) {
        lfsrCounter -= 1.0;
        const bit = ((lfsr >> 0) ^ (lfsr >> 2) ^ (lfsr >> 3) ^ (lfsr >> 5)) & 1;
        lfsr = (lfsr >> 1) | (bit << 15);
        currentNoise = (lfsr & 1) ? 1.0 : -1.0;
      }
      sample = currentNoise;
    }

    // ローパスフィルター適用
    const cutoff = p.filterStart + (p.filterEnd - p.filterStart) * t;
    const rc = 1.0 / (2 * Math.PI * Math.max(20, cutoff));
    const dt = 1.0 / SAMPLE_RATE;
    const alpha = dt / (rc + dt);
    lpOut = lpOut + alpha * (sample - lpOut);

    // 音量エンベロープ（クリックノイズ防止のため最初5msフェードイン）
    const attack = Math.min(1.0, i / (SAMPLE_RATE * 0.005));
    const env = attack * Math.pow(1.0 - t, p.decayCurve);

    buffer[i] = Math.max(-1.0, Math.min(1.0, lpOut * env * 0.85));
  }
  return buffer;
}

function playSound() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const samples = generateSamples(getParams());
  const audioBuffer = audioCtx.createBuffer(1, samples.length, SAMPLE_RATE);
  audioBuffer.getChannelData(0).set(samples);

  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audioCtx.destination);
  source.start();
}

// 44.1kHz / 16bit / Mono PCM WAVバイナリを作成してダウンロード
function downloadWav() {
  const samples = generateSamples(getParams());
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = SAMPLE_RATE * numChannels * (bitsPerSample / 8);
  const blockAlign = numChannels * (bitsPerSample / 8);
  const dataSize = samples.length * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeString(offset, str) {
    for (let i = 0; i < str.length; i++) {
      view.setUint8(offset + i, str.charCodeAt(i));
    }
  }

  // RIFFヘッダ
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  // fmtチャンク
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true); // PCM
  view.setUint16(20, 1, true);  // リニアPCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, SAMPLE_RATE, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  // dataチャンク
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  // 16-bit PCMデータ書き込み
  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }

  const blob = new Blob([buffer], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  let fname = document.getElementById('fileName').value.trim() || 'sample.wav';
  if (!fname.endsWith('.wav')) fname += '.wav';
  a.href = url;
  a.download = fname;
  a.click();
  URL.revokeObjectURL(url);
}

// レトロアーケード風プリセット
function applyPreset(type) {
  const set = (w, sf, ef, pc, lf, ld, dur, dc, fs, fe) => {
    document.getElementById('waveType').value = w;
    document.getElementById('startFreq').value = sf;
    document.getElementById('endFreq').value = ef;
    document.getElementById('pitchCurve').value = pc;
    document.getElementById('lfoFreq').value = lf;
    document.getElementById('lfoDepth').value = ld;
    document.getElementById('duration').value = dur;
    document.getElementById('decayCurve').value = dc;
    document.getElementById('filterStart').value = fs;
    document.getElementById('filterEnd').value = fe;
    upd();
    playSound();
  };

  if (type === 'zapper') {
    set('square', 1600, 140, 2.2, 0, 0, 0.2, 1.4, 9000, 1200);
  } else if (type === 'blaster') {
    set('triangle', 900, 180, 0.8, 35, 120, 0.45, 0.9, 5000, 800);
  } else if (type === 'explosion') {
    set('lfsr', 1200, 80, 1.5, 15, 200, 1.2, 1.8, 4500, 150);
  } else if (type === 'bacura') {
    set('square', 2200, 2100, 1.0, 110, 650, 0.25, 2.0, 10000, 4000);
  } else if (type === 'hit') {
    set('square', 600, 1400, 1.2, 65, 450, 0.35, 1.1, 8000, 2500);
  } else if (type === 'random') {
    const waves = ['square', 'sawtooth', 'triangle', 'noise', 'lfsr'];
    const w = waves[Math.floor(Math.random() * waves.length)];
    const sf = Math.floor(Math.random() * 2500) + 150;
    const ef = Math.floor(Math.random() * 1500) + 40;
    const pc = (Math.random() * 2.5 + 0.4).toFixed(1);
    const lf = Math.random() > 0.5 ? Math.floor(Math.random() * 120) : 0;
    const ld = lf > 0 ? Math.floor(Math.random() * 800) : 0;
    const dur = (Math.random() * 1.0 + 0.1).toFixed(2);
    const dc = (Math.random() * 2.0 + 0.5).toFixed(1);
    set(w, sf, ef, pc, lf, ld, dur, dc, 8000, 400);
  }
}

upd();
</script>
</body>
</html>
