<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>FBNeo Retro SFX Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Meiryo, sans-serif;
      background-color: #121218;
      color: #e0e0e0;
      max-width: 640px;
      margin: 24px auto;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 1.3rem;
      color: #00ffcc;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-top: 0;
    }
    .ver-badge {
      font-size: 0.78rem;
      background: #1b2f2c;
      color: #7fffd4;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #00ffcc88;
      vertical-align: middle;
      margin-left: 6px;
      font-family: monospace;
    }
    .badge {
      font-size: 0.75rem;
      background: #223;
      color: #00ffcc;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #00ffcc;
      vertical-align: middle;
      margin-left: 8px;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    button {
      background-color: #2a2a38;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    button:hover { background-color: #3a3a4e; border-color: #00ffcc; }
    .custom-preset-box {
      background: #1a1a24;
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 18px;
      border: 1px solid #2c2c3a;
    }
    .custom-preset-box h2 {
      font-size: 0.85rem;
      color: #00ffcc;
      margin: 0 0 8px 0;
    }
    .preset-save-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .preset-save-row input {
      flex: 1;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .btn-save {
      background-color: #1f5c4d;
      border-color: #00ffcc;
      font-weight: bold;
    }
    .btn-save:hover { background-color: #287764; }
    .custom-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .custom-item {
      display: inline-flex;
      align-items: center;
      background: #252534;
      border: 1px solid #444;
      border-radius: 4px;
      overflow: hidden;
    }
    .custom-item button.load-btn {
      border: none;
      background: transparent;
      padding: 6px 10px;
    }
    .custom-item button.load-btn:hover {
      background: #333347;
      color: #00ffcc;
    }
    .custom-item button.del-btn {
      border: none;
      border-left: 1px solid #3c3c50;
      background: transparent;
      color: #ff7b7b;
      padding: 6px 8px;
      font-size: 0.75rem;
    }
    .custom-item button.del-btn:hover {
      background: #522424;
    }
    .empty-msg {
      font-size: 0.8rem;
      color: #777;
    }
    .control-group {
      background: #1a1a24;
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 14px;
      border: 1px solid #2c2c3a;
    }
    .control-group h2 {
      font-size: 0.9rem;
      color: #aaa;
      margin: 0 0 10px 0;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .row label { font-size: 0.85rem; width: 42%; }
    .row input[type="range"] { width: 42%; accent-color: #00ffcc; }
    .row select { width: 42%; background: #222; color: #fff; border: 1px solid #555; padding: 4px; }
    .row span { font-size: 0.8rem; width: 14%; text-align: right; font-family: monospace; color: #00ffcc; }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn-play {
      flex: 1;
      background-color: #007acc;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      padding: 12px;
    }
    .btn-play:hover { background-color: #0090f0; }
    .btn-dl {
      flex: 1;
      background-color: #00aa77;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      padding: 12px;
    }
    .btn-dl:hover { background-color: #00cc88; }
    .filename-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 0.85rem;
    }
    .filename-box input {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 6px;
      border-radius: 4px;
      width: 120px;
      font-family: monospace;
    }
    .status-note {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #9aa0b4;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>FBNeo Retro SFX Generator<span class="ver-badge">v1.3</span><span class="badge">44.1kHz / 16bit / Mono</span></h1>

  <div class="presets">
    <button onclick="applyPreset('zapper')">🔫 発射音 (ザッパー風)</button>
    <button onclick="applyPreset('laser')">⚡ 連射レーザー</button>
    <button onclick="applyPreset('plasma')">🔵 プラズマ弾</button>
    <button onclick="applyPreset('cannon')">🔺 重低音キャノン</button>
    <button onclick="applyPreset('blaster')">💣 爆撃音 (ブラスター風)</button>
    <button onclick="applyPreset('explosion')">💥 大爆発 (ノイズ減衰)</button>
    <button onclick="applyPreset('mini_boom')">🔥 小爆発・被弾</button>
    <button onclick="applyPreset('quake_boom')">🌋 地響き爆破</button>
    <button onclick="applyPreset('bacura')">🛡️ 金属弾き音 (バキュラ風)</button>
    <button onclick="applyPreset('hit')">👾 敵撃破音 (ピロロッ)</button>
    <button onclick="applyPreset('random')">🎲 ランダム生成</button>
  </div>

  <div class="custom-preset-box">
    <h2 id="customPresetTitle">★ 自作プリセット保存 (最大10個 / 0 / 10)</h2>
    <div class="preset-save-row">
      <input type="text" id="presetName" maxlength="24" placeholder="プリセット名（例: 自機ショット01）">
      <button class="btn-save" onclick="saveCustomPreset()">💾 プリセット保存</button>
    </div>
    <div class="custom-list" id="customPresetList"></div>
  </div>

  <div class="control-group">
    <h2>1. 基本波形 ＆ ピッチ (オシレーター)</h2>
    <div class="row">
      <label>波形タイプ</label>
      <select id="waveType">
        <option value="square">矩形波 (Square - ファミコン/基板風)</option>
        <option value="sawtooth">ノコギリ波 (Sawtooth - 鋭い音)</option>
        <option value="triangle">三角波 (Triangle - 柔らかい音)</option>
        <option value="noise">ホワイトノイズ (爆発・風)</option>
        <option value="lfsr">LFSR粗ノイズ (レトロチップ爆発)</option>
      </select>
      <span></span>
    </div>
    <div class="row">
      <label>開始周波数 (Hz)</label>
      <input type="range" id="startFreq" min="40" max="4000" value="1400" oninput="upd()">
      <span id="startFreqVal">1400</span>
    </div>
    <div class="row">
      <label>終了周波数 (Hz)</label>
      <input type="range" id="endFreq" min="20" max="4000" value="120" oninput="upd()">
      <span id="endFreqVal">120</span>
    </div>
    <div class="row">
      <label>ピッチ変化カーブ</label>
      <input type="range" id="pitchCurve" min="0.2" max="4.0" step="0.1" value="1.8" oninput="upd()">
      <span id="pitchCurveVal">1.8</span>
    </div>
  </div>

  <div class="control-group">
    <h2>2. 変調 (ビブラート / 金属音 / アルペジオ感)</h2>
    <div class="row">
      <label>変調スピード (LFO Hz)</label>
      <input type="range" id="lfoFreq" min="0" max="150" value="0" oninput="upd()">
      <span id="lfoFreqVal">0</span>
    </div>
    <div class="row">
      <label>変調の深さ (Hz)</label>
      <input type="range" id="lfoDepth" min="0" max="1500" value="0" oninput="upd()">
      <span id="lfoDepthVal">0</span>
    </div>
  </div>

  <div class="control-group">
    <h2>3. フィルター ＆ 時間 (エンベロープ) ＆ 音量</h2>
    <div class="row">
      <label>長さ (秒)</label>
      <input type="range" id="duration" min="0.05" max="2.5" step="0.05" value="0.25" oninput="upd()">
      <span id="durationVal">0.25</span>
    </div>
    <div class="row">
      <label>音量減衰カーブ</label>
      <input type="range" id="decayCurve" min="0.3" max="4.0" step="0.1" value="1.2" oninput="upd()">
      <span id="decayCurveVal">1.2</span>
    </div>
    <div class="row">
      <label>ローパス開始 (Hz)</label>
      <input type="range" id="filterStart" min="100" max="12000" step="100" value="8000" oninput="upd()">
      <span id="filterStartVal">8000</span>
    </div>
    <div class="row">
      <label>ローパス終了 (Hz)</label>
      <input type="range" id="filterEnd" min="50" max="12000" step="50" value="1000" oninput="upd()">
      <span id="filterEndVal">1000</span>
    </div>
    <div class="row">
      <label>音量 (ボリューム倍率)</label>
      <input type="range" id="volume" min="0.0" max="2.0" step="0.05" value="1.0" oninput="upd()">
      <span id="volumeVal">1.00</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn-play" onclick="playSound()">▶ 試聴する (Play)</button>
    <button class="btn-dl" onclick="downloadWav()">💾 WAVダウンロード</button>
  </div>

  <div class="filename-box">
    <label for="fileName">保存ファイル名:</label>
    <input type="text" id="fileName" value="00.wav">
    <span style="color:#888;">※FBNeo用に連番(00.wav, 01.wav等)で保存できます</span>
  </div>

  <div class="status-note" id="audioStatus">AudioContext: 未初期化（クリックで再生）</div>

<script>
const SAMPLE_RATE = 44100;
const STORAGE_KEY = 'fbneo_retro_sfx_custom_presets_v1';
const MAX_CUSTOM_PRESETS = 10;
let audioCtx = null;

function setStatus(msg) {
  const el = document.getElementById('audioStatus');
  if (el) el.textContent = msg;
}

function upd() {
  const ids = ['startFreq', 'endFreq', 'pitchCurve', 'lfoFreq', 'lfoDepth', 'duration', 'decayCurve', 'filterStart', 'filterEnd'];
  ids.forEach(id => {
    document.getElementById(id + 'Val').textContent = document.getElementById(id).value;
  });
  const vol = parseFloat(document.getElementById('volume').value);
  document.getElementById('volumeVal').textContent = vol.toFixed(2);
}

function getParams() {
  return {
    waveType: document.getElementById('waveType').value,
    startFreq: parseFloat(document.getElementById('startFreq').value),
    endFreq: parseFloat(document.getElementById('endFreq').value),
    pitchCurve: parseFloat(document.getElementById('pitchCurve').value),
    lfoFreq: parseFloat(document.getElementById('lfoFreq').value),
    lfoDepth: parseFloat(document.getElementById('lfoDepth').value),
    duration: parseFloat(document.getElementById('duration').value),
    decayCurve: parseFloat(document.getElementById('decayCurve').value),
    filterStart: parseFloat(document.getElementById('filterStart').value),
    filterEnd: parseFloat(document.getElementById('filterEnd').value),
    volume: parseFloat(document.getElementById('volume').value)
  };
}

function applyParamsObject(p) {
  document.getElementById('waveType').value = p.waveType ?? 'square';
  document.getElementById('startFreq').value = p.startFreq ?? 1400;
  document.getElementById('endFreq').value = p.endFreq ?? 120;
  document.getElementById('pitchCurve').value = p.pitchCurve ?? 1.8;
  document.getElementById('lfoFreq').value = p.lfoFreq ?? 0;
  document.getElementById('lfoDepth').value = p.lfoDepth ?? 0;
  document.getElementById('duration').value = p.duration ?? 0.25;
  document.getElementById('decayCurve').value = p.decayCurve ?? 1.2;
  document.getElementById('filterStart').value = p.filterStart ?? 8000;
  document.getElementById('filterEnd').value = p.filterEnd ?? 1000;
  document.getElementById('volume').value = p.volume ?? 1.0;
  upd();
  playSound();
}

function loadCustomPresets() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
    const trimmed = {};
    Object.keys(parsed).slice(0, MAX_CUSTOM_PRESETS).forEach(k => {
      trimmed[k] = parsed[k];
    });
    return trimmed;
  } catch (e) {
    return {};
  }
}

function saveCustomPresetsObj(obj) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
  } catch (e) {
    setStatus('保存エラー: localStorage に書き込めませんでした');
  }
}

function saveCustomPreset() {
  const input = document.getElementById('presetName');
  const name = input.value.trim();
  if (!name) {
    setStatus('プリセット名を入力してから保存してな');
    input.focus();
    return;
  }
  const presets = loadCustomPresets();
  const isOverwrite = Object.prototype.hasOwnProperty.call(presets, name);
  const currentCount = Object.keys(presets).length;

  if (!isOverwrite && currentCount >= MAX_CUSTOM_PRESETS) {
    setStatus(`自作プリセットは最大${MAX_CUSTOM_PRESETS}個までやで。不要なものを削除するか、既存の名前で上書きしてな`);
    return;
  }

  presets[name] = getParams();
  saveCustomPresetsObj(presets);
  renderCustomPresets();
  setStatus(isOverwrite ? `プリセット「${name}」を上書き保存しました` : `プリセット「${name}」を保存しました (${Object.keys(presets).length}/${MAX_CUSTOM_PRESETS})`);
}

function deleteCustomPreset(name) {
  const presets = loadCustomPresets();
  if (!Object.prototype.hasOwnProperty.call(presets, name)) return;
  delete presets[name];
  saveCustomPresetsObj(presets);
  renderCustomPresets();
  setStatus(`プリセット「${name}」を削除しました (${Object.keys(presets).length}/${MAX_CUSTOM_PRESETS})`);
}

function renderCustomPresets() {
  const container = document.getElementById('customPresetList');
  const titleEl = document.getElementById('customPresetTitle');
  const presets = loadCustomPresets();
  const names = Object.keys(presets);

  if (titleEl) {
    titleEl.textContent = `★ 自作プリセット保存 (最大${MAX_CUSTOM_PRESETS}個 / ${names.length} / ${MAX_CUSTOM_PRESETS})`;
  }

  container.innerHTML = '';
  if (names.length === 0) {
    const span = document.createElement('span');
    span.className = 'empty-msg';
    span.textContent = `まだ自作プリセットはありません（最大${MAX_CUSTOM_PRESETS}個まで保存できます）。`;
    container.appendChild(span);
    return;
  }

  names.forEach(name => {
    const item = document.createElement('div');
    item.className = 'custom-item';

    const loadBtn = document.createElement('button');
    loadBtn.className = 'load-btn';
    loadBtn.textContent = name;
    loadBtn.onclick = () => {
      document.getElementById('presetName').value = name;
      applyParamsObject(presets[name]);
    };

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.textContent = '✕';
    delBtn.title = `${name} を削除`;
    delBtn.onclick = () => deleteCustomPreset(name);

    item.appendChild(loadBtn);
    item.appendChild(delBtn);
    container.appendChild(item);
  });
}

function generateSamples(p) {
  const totalSamples = Math.max(1, Math.floor(SAMPLE_RATE * p.duration));
  const buffer = new Float32Array(totalSamples);

  let phase = 0;
  let lfoPhase = 0;
  let lfsr = 0xACE1;
  let lfsrCounter = 0;
  let currentNoise = 0;
  let lpOut = 0;

  for (let i = 0; i < totalSamples; i++) {
    const t = i / totalSamples;

    const pitchProgress = Math.pow(t, p.pitchCurve);
    let freq = p.startFreq + (p.endFreq - p.startFreq) * pitchProgress;

    if (p.lfoFreq > 0 && p.lfoDepth > 0) {
      lfoPhase += (2 * Math.PI * p.lfoFreq) / SAMPLE_RATE;
      freq += Math.sin(lfoPhase) * p.lfoDepth;
    }
    freq = Math.max(10, freq);

    phase += freq / SAMPLE_RATE;
    if (phase >= 1.0) phase -= Math.floor(phase);

    let sample = 0;
    if (p.waveType === 'square') {
      sample = phase < 0.5 ? 1.0 : -1.0;
    } else if (p.waveType === 'sawtooth') {
      sample = 2.0 * phase - 1.0;
    } else if (p.waveType === 'triangle') {
      sample = 1.0 - 4.0 * Math.abs(Math.round(phase - 0.25) - (phase - 0.25));
    } else if (p.waveType === 'noise') {
      sample = Math.random() * 2.0 - 1.0;
    } else if (p.waveType === 'lfsr') {
      lfsrCounter += freq / SAMPLE_RATE;
      if (lfsrCounter >= 1.0) {
        lfsrCounter -= 1.0;
        const bit = ((lfsr >> 0) ^ (lfsr >> 2) ^ (lfsr >> 3) ^ (lfsr >> 5)) & 1;
        lfsr = (lfsr >> 1) | (bit << 15);
        currentNoise = (lfsr & 1) ? 1.0 : -1.0;
      }
      sample = currentNoise;
    }

    const cutoff = p.filterStart + (p.filterEnd - p.filterStart) * t;
    const rc = 1.0 / (2 * Math.PI * Math.max(20, cutoff));
    const dt = 1.0 / SAMPLE_RATE;
    const alpha = dt / (rc + dt);
    lpOut = lpOut + alpha * (sample - lpOut);

    const attack = Math.min(1.0, i / (SAMPLE_RATE * 0.005));
    const env = attack * Math.pow(1.0 - t, p.decayCurve);

    buffer[i] = Math.max(-1.0, Math.min(1.0, lpOut * env * 0.85 * p.volume));
  }
  return buffer;
}

async function ensureAudioContext() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) {
    setStatus('エラー: このブラウザは Web Audio API に非対応です');
    return null;
  }
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new Ctx({ sampleRate: SAMPLE_RATE });
  }
  if (audioCtx.state === 'suspended') {
    try {
      await audioCtx.resume();
    } catch (e) {
      setStatus('resume失敗: ' + e.message);
    }
  }
  setStatus(`AudioContext: ${audioCtx.state} (${audioCtx.sampleRate}Hz)`);
  return audioCtx;
}

async function playSound() {
  const ctx = await ensureAudioContext();
  if (!ctx) return;

  const samples = generateSamples(getParams());
  const audioBuffer = ctx.createBuffer(1, samples.length, SAMPLE_RATE);
  audioBuffer.getChannelData(0).set(samples);

  const source = ctx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(ctx.destination);
  source.start();
}

function downloadWav() {
  const samples = generateSamples(getParams());
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = SAMPLE_RATE * numChannels * (bitsPerSample / 8);
  const blockAlign = numChannels * (bitsPerSample / 8);
  const dataSize = samples.length * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeString(offset, str) {
    for (let i = 0; i < str.length; i++) {
      view.setUint8(offset + i, str.charCodeAt(i));
    }
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, SAMPLE_RATE, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }

  const blob = new Blob([buffer], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  let fname = document.getElementById('fileName').value.trim() || 'sample.wav';
  if (!fname.endsWith('.wav')) fname += '.wav';
  a.href = url;
  a.download = fname;
  a.click();
  URL.revokeObjectURL(url);
}

function applyPreset(type) {
  if (type === 'zapper') {
    applyParamsObject({ waveType: 'square', startFreq: 1600, endFreq: 140, pitchCurve: 2.2, lfoFreq: 0, lfoDepth: 0, duration: 0.2, decayCurve: 1.4, filterStart: 9000, filterEnd: 1200, volume: 1.0 });
  } else if (type === 'laser') {
    applyParamsObject({ waveType: 'sawtooth', startFreq: 2600, endFreq: 220, pitchCurve: 2.8, lfoFreq: 0, lfoDepth: 0, duration: 0.14, decayCurve: 1.7, filterStart: 10000, filterEnd: 1800, volume: 1.0 });
  } else if (type === 'plasma') {
    applyParamsObject({ waveType: 'square', startFreq: 1100, endFreq: 260, pitchCurve: 1.3, lfoFreq: 48, lfoDepth: 280, duration: 0.28, decayCurve: 1.2, filterStart: 7500, filterEnd: 900, volume: 1.0 });
  } else if (type === 'cannon') {
    applyParamsObject({ waveType: 'triangle', startFreq: 420, endFreq: 48, pitchCurve: 2.4, lfoFreq: 18, lfoDepth: 55, duration: 0.42, decayCurve: 1.5, filterStart: 3200, filterEnd: 250, volume: 1.15 });
  } else if (type === 'blaster') {
    applyParamsObject({ waveType: 'triangle', startFreq: 900, endFreq: 180, pitchCurve: 0.8, lfoFreq: 35, lfoDepth: 120, duration: 0.45, decayCurve: 0.9, filterStart: 5000, filterEnd: 800, volume: 1.0 });
  } else if (type === 'explosion') {
    applyParamsObject({ waveType: 'lfsr', startFreq: 1200, endFreq: 80, pitchCurve: 1.5, lfoFreq: 15, lfoDepth: 200, duration: 1.2, decayCurve: 1.8, filterStart: 4500, filterEnd: 150, volume: 1.0 });
  } else if (type === 'mini_boom') {
    applyParamsObject({ waveType: 'noise', startFreq: 950, endFreq: 140, pitchCurve: 1.6, lfoFreq: 0, lfoDepth: 0, duration: 0.22, decayCurve: 2.2, filterStart: 6000, filterEnd: 400, volume: 1.0 });
  } else if (type === 'quake_boom') {
    applyParamsObject({ waveType: 'lfsr', startFreq: 320, endFreq: 35, pitchCurve: 1.1, lfoFreq: 12, lfoDepth: 95, duration: 1.85, decayCurve: 1.3, filterStart: 2200, filterEnd: 90, volume: 1.2 });
  } else if (type === 'bacura') {
    applyParamsObject({ waveType: 'square', startFreq: 2200, endFreq: 2100, pitchCurve: 1.0, lfoFreq: 110, lfoDepth: 650, duration: 0.25, decayCurve: 2.0, filterStart: 10000, filterEnd: 4000, volume: 1.0 });
  } else if (type === 'hit') {
    applyParamsObject({ waveType: 'square', startFreq: 600, endFreq: 1400, pitchCurve: 1.2, lfoFreq: 65, lfoDepth: 450, duration: 0.35, decayCurve: 1.1, filterStart: 8000, filterEnd: 2500, volume: 1.0 });
  } else if (type === 'random') {
    const waves = ['square', 'sawtooth', 'triangle', 'noise', 'lfsr'];
    const w = waves[Math.floor(Math.random() * waves.length)];
    const sf = Math.floor(Math.random() * 2500) + 150;
    const ef = Math.floor(Math.random() * 1500) + 40;
    const pc = parseFloat((Math.random() * 2.5 + 0.4).toFixed(1));
    const lf = Math.random() > 0.5 ? Math.floor(Math.random() * 120) : 0;
    const ld = lf > 0 ? Math.floor(Math.random() * 800) : 0;
    const dur = parseFloat((Math.random() * 1.0 + 0.1).toFixed(2));
    const dc = parseFloat((Math.random() * 2.0 + 0.5).toFixed(1));
    applyParamsObject({ waveType: w, startFreq: sf, endFreq: ef, pitchCurve: pc, lfoFreq: lf, lfoDepth: ld, duration: dur, decayCurve: dc, filterStart: 8000, filterEnd: 400, volume: 1.0 });
  }
}

upd();
renderCustomPresets();
</script>
